<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05080F;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}a{color:#00E5FF;}a:hover{color:#7DF3FF;}</style>
</helmet>
<div style="position:relative;height:100vh;overflow:hidden;">
  <div style="position:absolute;left:50%;top:50%;width:414px;height:868px;transform:translate(-50%,-50%) scale({{ scale }});transform-origin:center center;padding:12px;box-sizing:border-box;border-radius:56px;background:linear-gradient(160deg,#2A3446,#0B111C 40%,#1A2232);box-shadow:0 50px 100px rgba(0,0,0,0.6);">
    <div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#070B14;">
      <iframe src="{{ src }}" title="Mobile preview" style="width:390px;height:844px;border:0;display:block;"></iframe>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Order form&quot;,&quot;Real estate designs&quot;,&quot;Client card&quot;,&quot;Realtor demo&quot;,&quot;After order · paid&quot;,&quot;After order · awaiting payment&quot;,&quot;After order · design for me&quot;],&quot;default&quot;:&quot;Order form&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;season&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Auto&quot;,&quot;Off&quot;,&quot;Holidays&quot;,&quot;New Year&quot;,&quot;Thanksgiving&quot;],&quot;default&quot;:&quot;Auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;region&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;US&quot;,&quot;IN&quot;],&quot;default&quot;:&quot;US&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { vh: 900, vw: 1200 };
  componentDidMount() { this.onR = () => this.setState({ vh: window.innerHeight, vw: window.innerWidth }); this.onR(); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() { const r = this.props.region || 'US', pgn = this.props.page || 'Order form', pg = pgn === 'Real estate designs' ? './Order%20Card.dc.html?plan=basic&fresh=1&' : pgn === 'Realtor demo' ? './Tap%20Card.dc.html?demo=realtor&' : pgn === 'Client card' ? './Tap%20Card.dc.html?' : pgn === 'After order · paid' ? './Order%20Card.dc.html?fresh=1&demoDone=paid&' : pgn === 'After order · awaiting payment' ? './Order%20Card.dc.html?fresh=1&demoDone=unpaid&' : pgn === 'After order · design for me' ? './Order%20Card.dc.html?fresh=1&demoDone=dfm&' : './Order%20Card.dc.html?fresh=1&'; const sea = { 'Off': 'off', 'Holidays': 'holidays', 'New Year': 'newyear', 'Thanksgiving': 'thanksgiving' }[this.props.season] || ''; return { src: pg + 'region=' + r + (sea && pgn !== 'Order form' && !/^After order/.test(pgn) ? '&season=' + sea : ''), scale: Math.min(1, (this.state.vh - 32) / 868, (this.state.vw - 32) / 414).toFixed(3) }; }
}
</script>
</body>
</html>
