<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F5F2EC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#101820;-webkit-font-smoothing:antialiased;} a{color:#0B7C86;} a:hover{color:#086670;}</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:48px 24px;box-sizing:border-box;">
  <div ref="{{ bigRef }}" style="width:min(340px,70vw);aspect-ratio:1;">
    <svg viewBox="0 0 200 210" width="100%" height="100%" role="img" aria-label="Effy, the NexBizRise elephant">
      <defs>
        <linearGradient id="effyBodyA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B7BE4"></stop><stop offset="1" stop-color="#22C3B0"></stop></linearGradient>
        <linearGradient id="effyEarA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE3F0"></stop><stop offset="1" stop-color="#5FD6C4"></stop></linearGradient>
        <radialGradient id="effyShineA" cx="0.35" cy="0.25" r="0.6"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient>
      </defs>
      <ellipse cx="100" cy="203" rx="52" ry="6" fill="#101820" opacity="0.12"></ellipse>
      <ellipse cx="100" cy="164" rx="48" ry="36" fill="url(#effyBodyA)"></ellipse>
      <ellipse cx="78" cy="194" rx="14" ry="10" fill="url(#effyBodyA)"></ellipse>
      <ellipse cx="122" cy="194" rx="14" ry="10" fill="url(#effyBodyA)"></ellipse>
      <path d="M70 199 h5 M77 200 h5 M84 199 h5 M111 199 h5 M118 200 h5 M125 199 h5" stroke="#DDF7F3" stroke-width="3" stroke-linecap="round"></path>
      <g ref="{{ bigEarL }}" style="transform-origin:62px 80px;">
        <ellipse cx="40" cy="84" rx="38" ry="44" fill="url(#effyBodyA)" transform="rotate(-18 40 84)"></ellipse>
        <ellipse cx="44" cy="86" rx="25" ry="31" fill="url(#effyEarA)" transform="rotate(-18 44 86)"></ellipse>
      </g>
      <g ref="{{ bigEarR }}" style="transform-origin:138px 80px;">
        <ellipse cx="160" cy="84" rx="38" ry="44" fill="url(#effyBodyA)" transform="rotate(18 160 84)"></ellipse>
        <ellipse cx="156" cy="86" rx="25" ry="31" fill="url(#effyEarA)" transform="rotate(18 156 86)"></ellipse>
      </g>
      <circle cx="100" cy="86" r="54" fill="url(#effyBodyA)"></circle>
      <circle cx="100" cy="86" r="54" fill="url(#effyShineA)"></circle>
      <path d="M96 33 q4 -12 12 -8 q-6 2 -4 9" fill="none" stroke="#2B7BE4" stroke-width="4" stroke-linecap="round"></path>
      <path d="M100 112 C98 134 104 150 120 150 C132 150 134 136 124 134" fill="none" stroke="url(#effyBodyA)" stroke-width="19" stroke-linecap="round"></path>
      <path d="M100 116 C99 132 104 144 118 145" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"></path>
      <ellipse cx="68" cy="108" rx="9" ry="5.5" fill="#FF8FB1" opacity="0.55"></ellipse>
      <ellipse cx="132" cy="108" rx="9" ry="5.5" fill="#FF8FB1" opacity="0.55"></ellipse>
      <ellipse cx="80" cy="86" rx="13" ry="15" fill="#FFFFFF"></ellipse>
      <ellipse cx="120" cy="86" rx="13" ry="15" fill="#FFFFFF"></ellipse>
      <g ref="{{ bigPupL }}"><circle cx="80" cy="87" r="8.5" fill="#10233F"></circle><circle cx="83" cy="83" r="3" fill="#FFFFFF"></circle><circle cx="77.5" cy="90.5" r="1.3" fill="#FFFFFF"></circle></g>
      <g ref="{{ bigPupR }}"><circle cx="120" cy="87" r="8.5" fill="#10233F"></circle><circle cx="123" cy="83" r="3" fill="#FFFFFF"></circle><circle cx="117.5" cy="90.5" r="1.3" fill="#FFFFFF"></circle></g>
    </svg>
  </div>
  <p style="margin:0;font-size:44px;font-weight:800;letter-spacing:-0.03em;">Effy</p>
  <p style="margin:0;max-width:420px;text-align:center;font-size:16px;line-height:1.6;color:#3A4048;">Move your mouse around the page. Effy's eyes follow it. The small Effy walks along the bottom of the screen, stops to look around, and says hi when you hover over it.</p>
</div>

<div ref="{{ walkRef }}" style="position:fixed;left:0;bottom:14px;z-index:60;width:96px;will-change:transform;">
  <div style="position:absolute;left:50%;bottom:100%;margin-bottom:4px;white-space:nowrap;padding:9px 13px;border-radius:14px;background:#FFFFFF;box-shadow:0 10px 24px rgba(16,24,32,0.14);font-size:13px;font-weight:700;color:#101820;opacity:{{ bubbleOp }};transform:translateX(-50%) {{ bubbleTf }};transition:opacity .25s, transform .25s;pointer-events:none;">{{ bubbleText }}</div>
  <div ref="{{ miniRef }}" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" role="img" aria-label="Effy, the NexBizRise elephant" style="width:96px;height:101px;filter:drop-shadow(0 10px 14px rgba(16,24,32,0.2));transform-origin:50% 100%;">
    <svg ref="{{ miniSvg }}" viewBox="0 0 200 210" width="100%" height="100%" aria-hidden="true" style="transform-origin:50% 50%;">
      <defs>
        <linearGradient id="effyBodyB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B7BE4"></stop><stop offset="1" stop-color="#22C3B0"></stop></linearGradient>
        <linearGradient id="effyEarB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE3F0"></stop><stop offset="1" stop-color="#5FD6C4"></stop></linearGradient>
      </defs>
      <ellipse cx="100" cy="164" rx="48" ry="36" fill="url(#effyBodyB)"></ellipse>
      <ellipse ref="{{ miniFootL }}" cx="78" cy="194" rx="14" ry="10" fill="url(#effyBodyB)"></ellipse>
      <ellipse ref="{{ miniFootR }}" cx="122" cy="194" rx="14" ry="10" fill="url(#effyBodyB)"></ellipse>
      <g ref="{{ miniEarL }}" style="transform-origin:62px 80px;">
        <ellipse cx="40" cy="84" rx="38" ry="44" fill="url(#effyBodyB)" transform="rotate(-18 40 84)"></ellipse>
        <ellipse cx="44" cy="86" rx="25" ry="31" fill="url(#effyEarB)" transform="rotate(-18 44 86)"></ellipse>
      </g>
      <g ref="{{ miniEarR }}" style="transform-origin:138px 80px;">
        <ellipse cx="160" cy="84" rx="38" ry="44" fill="url(#effyBodyB)" transform="rotate(18 160 84)"></ellipse>
        <ellipse cx="156" cy="86" rx="25" ry="31" fill="url(#effyEarB)" transform="rotate(18 156 86)"></ellipse>
      </g>
      <circle cx="100" cy="86" r="54" fill="url(#effyBodyB)"></circle>
      <path d="M96 33 q4 -12 12 -8 q-6 2 -4 9" fill="none" stroke="#2B7BE4" stroke-width="4" stroke-linecap="round"></path>
      <path d="M100 112 C98 134 104 150 120 150 C132 150 134 136 124 134" fill="none" stroke="url(#effyBodyB)" stroke-width="19" stroke-linecap="round"></path>
      <ellipse cx="68" cy="108" rx="9" ry="5.5" fill="#FF8FB1" opacity="0.55"></ellipse>
      <ellipse cx="132" cy="108" rx="9" ry="5.5" fill="#FF8FB1" opacity="0.55"></ellipse>
      <ellipse cx="80" cy="86" rx="13" ry="15" fill="#FFFFFF"></ellipse>
      <ellipse cx="120" cy="86" rx="13" ry="15" fill="#FFFFFF"></ellipse>
      <g ref="{{ miniPupL }}"><circle cx="80" cy="87" r="8.5" fill="#10233F"></circle><circle cx="83" cy="83" r="3" fill="#FFFFFF"></circle></g>
      <g ref="{{ miniPupR }}"><circle cx="120" cy="87" r="8.5" fill="#10233F"></circle><circle cx="123" cy="83" r="3" fill="#FFFFFF"></circle></g>
    </svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hover: false };
  r = {};
  ref(k) { return this.r[k] || (this.r[k] = React.createRef()); }
  componentDidMount() {
    this.reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.target = null; this.lastMove = 0;
    this.eyes = { big: { x: 0, y: 0 }, mini: { x: 0, y: 0 } };
    this.onMove = e => { const p = e.touches ? e.touches[0] : e; if (!p) return; this.target = { x: p.clientX, y: p.clientY }; this.lastMove = performance.now(); };
    window.addEventListener('mousemove', this.onMove, { passive: true });
    window.addEventListener('touchstart', this.onMove, { passive: true });
    const t0 = performance.now();
    const W = { x: 40, dir: 1, mode: 'walk', until: t0 + 6000, phase: 0, last: t0 };
    this.W = W;
    const loop = now => {
      const t = (now - t0) / 1000, dt = Math.min(now - W.last, 50) / 1000; W.last = now;
      const walkEl = this.ref('walkRef').current, svg = this.ref('miniSvg').current, mini = this.ref('miniRef').current;
      if (walkEl) {
        const maxX = window.innerWidth - 104;
        if (this.state.hover) W.mode = 'hover';
        else if (W.mode === 'hover') { W.mode = 'pause'; W.until = now + 1200; }
        if (W.mode !== 'hover' && now > W.until) {
          if (W.mode === 'walk') { W.mode = 'pause'; W.until = now + 1800 + Math.random() * 2200; }
          else { W.mode = 'walk'; W.until = now + 5000 + Math.random() * 5000; if (Math.random() < 0.4) W.dir *= -1; }
        }
        let rot = 0, bob = 0, fL = 0, fR = 0;
        if (W.mode === 'walk' && !this.reduce) {
          W.x += W.dir * 62 * dt;
          if (W.x > maxX) { W.x = maxX; W.dir = -1; } if (W.x < 8) { W.x = 8; W.dir = 1; }
          W.phase += dt * 7.5;
          const s = Math.sin(W.phase);
          rot = s * 6; bob = -Math.abs(s) * 6; fL = -Math.max(0, s) * 9; fR = -Math.max(0, -s) * 9;
        } else { W.x = Math.min(Math.max(W.x, 8), Math.max(8, maxX)); bob = Math.sin(t * 2) * 1.5; }
        walkEl.style.transform = `translateX(${W.x.toFixed(1)}px)`;
        if (mini) mini.style.transform = `translateY(${bob.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
        if (svg) svg.style.transform = `scaleX(${W.dir})`;
        const FL = this.ref('miniFootL').current, FR = this.ref('miniFootR').current;
        if (FL) FL.setAttribute('transform', `translate(0 ${fL.toFixed(2)})`);
        if (FR) FR.setAttribute('transform', `translate(0 ${fR.toFixed(2)})`);
        const flap = W.mode === 'walk' ? Math.sin(W.phase) * 6 : Math.sin(t * 1.6) * 3;
        const L = this.ref('miniEarL').current, R = this.ref('miniEarR').current;
        if (L && !this.reduce) L.style.transform = `rotate(${flap}deg)`;
        if (R && !this.reduce) R.style.transform = `rotate(${-flap}deg)`;
      }
      ['big', 'mini'].forEach(k => {
        const box = this.ref(k + 'Ref').current; if (!box) return;
        const b = box.getBoundingClientRect(), s = b.width / 200;
        const cx = b.left + 100 * s, cy = b.top + 86 * s;
        let tx, ty;
        const idle = !this.target || now - this.lastMove > 3500;
        const walking = k === 'mini' && W.mode === 'walk';
        if (walking && idle) { tx = 4 * W.dir; ty = 1; }
        else if (idle) { tx = Math.sin(t * 0.7) * 4; ty = Math.sin(t * 0.45) * 2; }
        else { const dx = this.target.x - cx, dy = this.target.y - cy, d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / (160 * s + 80)); tx = dx / d * 4.5 * m; ty = dy / d * 5 * m; }
        if (k === 'mini') tx *= W.dir;
        const e = this.eyes[k]; e.x += (tx - e.x) * 0.18; e.y += (ty - e.y) * 0.18;
        [this.ref(k + 'PupL').current, this.ref(k + 'PupR').current].forEach(g => g && g.setAttribute('transform', `translate(${e.x.toFixed(2)} ${e.y.toFixed(2)})`));
        if (k === 'big' && !this.reduce) {
          const bob = Math.sin(t * 2 + (k === 'mini' ? 1 : 0)) * (k === 'mini' ? 2.5 : 4);
          box.style.transform = `translateY(${bob.toFixed(2)}px)`;
          const flap = Math.sin(t * 1.6) * 3;
          const L = this.ref(k + 'EarL').current, R = this.ref(k + 'EarR').current;
          if (L) L.style.transform = `rotate(${flap}deg)`;
          if (R) R.style.transform = `rotate(${-flap}deg)`;
        }
      });
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); window.removeEventListener('mousemove', this.onMove); window.removeEventListener('touchstart', this.onMove); }
  renderVals() {
    const R = {};
    ['big', 'mini'].forEach(k => ['Ref', 'PupL', 'PupR', 'EarL', 'EarR'].forEach(p => R[k + p] = this.ref(k + p)));
    ['walkRef', 'miniSvg', 'miniFootL', 'miniFootR'].forEach(k => R[k] = this.ref(k));
    return { ...R, bubbleText: "Hi, I'm Effy!", hoverOn: () => this.setState({ hover: true }), hoverOff: () => this.setState({ hover: false }),
      bubbleOp: this.state.hover ? 1 : 0, bubbleTf: this.state.hover ? 'none' : 'translateY(6px)' };
  }
}
</script>
</body>
</html>
