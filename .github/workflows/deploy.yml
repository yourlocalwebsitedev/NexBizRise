name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Block accidental secrets
        run: |
          if grep -rEn "sb_secret_|service_role|sk_live_|sk_test_|-----BEGIN [A-Z ]*PRIVATE KEY" --include="*.html" --include="*.js" --include="*.sql" --include="*.toml" . ; then
            echo "Possible secret found. Remove it before deploying."; exit 1
          fi

      - name: Check worker syntax
        run: node --check deploy/single/_worker.js || node -e "import('./deploy/single/_worker.js').then(()=>console.log('ok'))"

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Health check
        run: |
          sleep 10
          curl -fsS https://nexbizrise.com/__health
